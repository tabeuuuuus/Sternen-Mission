<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sternen-Mission · Kinderanmeldung</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;color-scheme:dark}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:radial-gradient(circle at 85% 22%,#7252ba66,transparent 28%),radial-gradient(circle at 18% 68%,#147ca077,transparent 35%),#111947;display:grid;place-items:center;padding:18px}.box{width:min(100%,480px);border-radius:32px;background:linear-gradient(160deg,#253d89,#302265);border:3px solid #a5b6ff;box-shadow:0 20px 0 #0a1243,0 28px 55px #050a2aaa;padding:30px;text-align:center}h1{font-size:clamp(32px,7vw,51px);line-height:1.07;color:#ffe68c;text-shadow:0 4px #8f4a99;margin:18px 0}p{line-height:1.5;color:#e1e9ff}.planet{width:106px;height:106px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#d7faff,#62c8fc 40%,#5362cf 75%);box-shadow:0 0 0 12px #849bff22,0 0 40px #92ddff55;margin:auto}.small{text-transform:uppercase;letter-spacing:.15em;font-size:13px;font-weight:800;color:#c5e7ff}label{display:block;font-size:15px;font-weight:800;margin:22px 0 8px;text-align:left}input{width:100%;padding:17px 12px;border-radius:15px;border:3px solid #b7c6ff;background:#141e4b;color:#fff;text-align:center;font-size:18px;letter-spacing:.06em;outline-offset:3px}button{border:3px solid #fff3bb;border-radius:40px;padding:17px 35px;background:linear-gradient(#ffec78,#ffab46);color:#4b2868;font-size:22px;font-weight:900;box-shadow:0 7px #a64f71;cursor:pointer;margin-top:23px;width:100%}button:disabled{opacity:.6;cursor:wait}.notice{padding:13px;background:#351c56;border:1px solid #ef9dab;border-radius:12px;margin-top:20px;line-height:1.4}.ok{background:#204e50;border-color:#7af2cf}.hidden{display:none}small{color:#b8ccef}a{color:#ffe9a4}</style></head><body><main class="box"><div class="small">Dein Weltraumabenteuer</div><div class="planet" aria-hidden="true"></div><h1>STERNEN-<br>MISSION</h1>
<div id="login"><p>Gib deinen persönlichen Missionscode ein.</p><form id="form"><label for="code">Dein Missionscode</label><input id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" required placeholder="SM-..." aria-label="Persönlicher Missionscode"><button id="submit" type="submit">ANMELDEN</button></form></div>
<div id="welcome" class="hidden"><p id="greeting"></p><p>Dein Konto wurde erkannt. Die automatische Spielstand-Synchronisierung wird gerade vorbereitet.</p><button id="logout" type="button">ABMELDEN</button></div>
<div id="notice" role="status" class="notice hidden"></div>
<p><small>Testversion mit erfundenen Profilen · Zugangscodes nicht weitergeben</small></p></main>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase=createClient("https://usejitkmxcjpfusmloil.supabase.co","sb_publishable_kjXScgpazASX508ovdW5KQ_mQ5Rjgb7",{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
function notice(t,ok=false){$("notice").textContent=t;$("notice").classList.toggle("hidden",!t);$("notice").classList.toggle("ok",ok)}
function parseCode(raw){const value=raw.trim().replace(/\s+/g,"").toUpperCase();const m=/^SM-([A-HJ-NP-Z2-9]{12})-([A-HJ-NP-Z2-9]{24})$/.exec(value);if(!m)throw Error("Der Code hat nicht das richtige Format.");return {email:"sm-"+m[1].toLowerCase()+"@students.sternen-mission.invalid",password:m[2]}}
async function welcome(){const {data:{user}}=await supabase.auth.getUser();if(!user)return;const {data,error}=await supabase.from("sm_students").select("nickname").eq("auth_user_id",user.id).maybeSingle();if(error||!data){await supabase.auth.signOut();throw Error("Dieses Konto gehört nicht zu einem Kinderprofil.")}$("login").classList.add("hidden");$("welcome").classList.remove("hidden");$("greeting").textContent="Willkommen, "+data.nickname+"!";notice("Dein Kinderkonto ist erfolgreich angemeldet.",true)}
$("form").addEventListener("submit",async e=>{e.preventDefault();$("submit").disabled=true;notice("");try{const account=parseCode($("code").value);const {error}=await supabase.auth.signInWithPassword(account);if(error)throw Error("Dieser Missionscode wurde nicht erkannt.");$("code").value="";await welcome()}catch(err){notice(err.message)}finally{$("submit").disabled=false}});
$("logout").onclick=async()=>{await supabase.auth.signOut();$("welcome").classList.add("hidden");$("login").classList.remove("hidden");notice("")};
const {data:{session}}=await supabase.auth.getSession();if(session)try{await welcome()}catch(e){notice(e.message)}
</script></body></html>
