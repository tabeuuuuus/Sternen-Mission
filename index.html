const SKINS=[{id:'astronaut',e:'👩‍🚀',name:'Nova · Astronautin',cost:0},{id:'rocket',e:'🚀',name:'Blitz · Raketenpilot',cost:35},{id:'robot',e:'🤖',name:'Bixo · Roboter',cost:55},{id:'pirate',e:'🏴‍☠️',name:'Cosmo · Sternenpirat',cost:70},{id:'dragon',e:'🐉',name:'Flix · Sternendrache',cost:100},{id:'alien',e:'👾',name:'Zuri · Alien',cost:120}];
let db=load(),active=db.active,session=null,view='home',questionTimer=null;const $=id=>document.getElementById(id);const app=$('app');
function blank(){return {version:1,active:null,profiles:{}}}function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&d.profiles&&typeof d.profiles==='object')return d}catch{}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{alert('Speichern nicht möglich. Bitte exportiere den Spielstand.');return false}}
function uuid(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():'p'+Date.now()+Math.random().toString(36).slice(2)}
function player(){return active&&db.profiles[active]}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function factKey(a,b){return [Math.min(a,b),Math.max(a,b)].join('x')}
function stateFact(p,a,b){let k=factKey(a,b);return p.facts[k]||(p.facts[k]={right:0,wrong:0,streak:0,due:0,last:0})}
function stat(){let p=player();$('who').textContent=p?p.name:'Profil wählen';$('coins').textContent=p?p.coins:0}
function selectedAvatar(p){return avatarArt(p.skin)}

function avatarArt(id){const head=(face,helmet='#d8edff')=>`<svg class="character-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spielfigur"><ellipse cx="60" cy="108" rx="35" ry="7" fill="#040b2a" opacity=".35"/><path d="M35 92 Q28 68 47 63 L73 63 Q92 68 85 92 L78 102 H42Z" fill="#f4f7ff" stroke="#5562ac" stroke-width="4"/><path d="M48 67 V60 H72 V67" fill="#b2baf6"/><circle cx="60" cy="42" r="34" fill="${helmet}" stroke="#899ecf" stroke-width="5"/><path d="M34 38 Q36 19 60 18 Q88 18 89 40 V56 Q61 76 33 55Z" fill="#152a60" stroke="#819bd9" stroke-width="3"/>${face}<path d="M53 82 H67" stroke="#ffb85c" stroke-width="6" stroke-linecap="round"/><circle cx="82" cy="87" r="5" fill="#63eccc"/></svg>`;
const eyes=`<ellipse cx="47" cy="44" rx="4" ry="6" fill="#9befff"/><ellipse cx="72" cy="44" rx="4" ry="6" fill="#9befff"/><path d="M51 55 Q60 62 69 55" fill="none" stroke="#9befff" stroke-width="3" stroke-linecap="round"/>`;
const art={astronaut:head(eyes),rocket:`<svg class="character-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><ellipse cx="60" cy="109" rx="32" ry="6" fill="#050e2c" opacity=".3"/><path d="M46 86 L37 108 L53 96 L60 117 L67 96 L83 108 L74 86" fill="#ffbe62"/><path d="M60 9 C90 30 83 67 76 94 H44 C37 67 30 30 60 9Z" fill="#f4f6ff" stroke="#5675bf" stroke-width="4"/><circle cx="60" cy="51" r="15" fill="#67d9fa" stroke="#3b589b" stroke-width="5"/><path d="M43 69 L27 85 V98 L45 89 M77 69 L93 85 V98 L75 89" fill="#f8a8bb" stroke="#5675bf" stroke-width="4"/><path d="M49 82 H71" stroke="#ec7084" stroke-width="5"/></svg>`,robot:`<svg class="character-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><path d="M60 15 V27" stroke="#9de6e9" stroke-width="5"/><circle cx="60" cy="13" r="7" fill="#ffe68c"/><rect x="25" y="26" width="70" height="61" rx="17" fill="#a7c7ee" stroke="#5163b3" stroke-width="5"/><rect x="34" y="37" width="52" height="30" rx="9" fill="#172e67"/><rect x="44" y="44" width="10" height="13" rx="4" fill="#92fff0"/><rect x="66" y="44" width="10" height="13" rx="4" fill="#92fff0"/><path d="M48 74 H72" stroke="#556db4" stroke-width="4" stroke-linecap="round"/><rect x="35" y="88" width="50" height="18" rx="8" fill="#e3ebff" stroke="#5163b3" stroke-width="4"/></svg>`,pirate:head(`<path d="M42 45 H60" stroke="#cbeaff" stroke-width="5" stroke-linecap="round"/><circle cx="72" cy="44" r="7" fill="#f6d3b2"/><path d="M51 55 Q60 61 67 55" stroke="#f3bb9b" stroke-width="3" fill="none"/><path d="M34 28 Q55 2 82 27 L90 36 H31Z" fill="#29376e" stroke="#eac777" stroke-width="4"/>`),dragon:head(`<path d="M40 43 L53 48 L45 51 M80 43 L67 48 L75 51" stroke="#7df5c8" fill="none" stroke-width="5" stroke-linecap="round"/><path d="M49 58 Q60 66 71 58" stroke="#7df5c8" stroke-width="3" fill="none"/>`,'#8af5d4'),alien:head(`<ellipse cx="47" cy="43" rx="8" ry="12" fill="#133067"/><ellipse cx="73" cy="43" rx="8" ry="12" fill="#133067"/><path d="M54 59 Q60 63 66 59" stroke="#28578d" stroke-width="3" fill="none"/>`,'#9cf2b4')};const palettes={astronaut:['#63dfff','#80fbd6'],rocket:['#ffbe70','#ff789b'],robot:['#95f7ff','#b39bff'],pirate:['#ffd26a','#ff9e8c'],dragon:['#80ffd7','#a4ed91'],alien:['#a9f59d','#8cdfff']};let c=palettes[id]||palettes.astronaut;let base=art[id]||art.astronaut;const accents=`<g opacity=".95"><circle cx="17" cy="41" r="4" fill="${c[0]}"/><path d="M96 19 l2 8 8 2-8 2-2 8-2-8-8-2 8-2Z" fill="${c[1]}"/><circle cx="103" cy="83" r="3.5" fill="${c[0]}"/></g>`;return base.replace('</svg>',accents+'</svg>')}

function unlockedRows(p){let rows=[];for(let i=0;i<LEVELS.length;i++){if(i>p.completed)break;for(let r of LEVELS[i].rows)if(!rows.includes(r))rows.push(r)}return rows}
function factsFor(rows){return rows.flatMap(a=>Array.from({length:10},(_,i)=>({a,b:i+1,k:factKey(a,i+1)})))}
function dueFacts(p){let rows=unlockedRows(p);return factsFor(rows).filter(f=>{let v=p.facts[f.k];return v&&v.last&&v.due<=Date.now()}).sort((a,b)=>(p.facts[a.k].due-p.facts[b.k].due))}
function show(v){stopQuestionTimer();view=v;document.body.dataset.view=v;$('homeBtn').hidden=(v==='home');session=null;stat();if(!player())return profiles();if(v==='home')return home();if(v==='shop')return shop();if(v==='profiles')return profiles();if(v==='map')return map();}
function profiles(){const ps=Object.entries(db.profiles);app.innerHTML=`<section class="panel"><h1>Wer spielt heute?</h1><p class="muted">Wähle dein Profil. Jedes Kind hat seinen eigenen Spielstand.</p><div id="profilesList">${ps.map(([id,p])=>`<button class="profile ${active===id?'active':''}" data-profile="${esc(id)}">${esc(p.name)} · Level ${p.completed+1}</button>`).join('')}</div><div class="divider"></div><h2>Neues Profil erstellen</h2><form id="newPlayer" class="row"><input required minlength="1" maxlength="24" id="newName" placeholder="Vorname oder Kürzel" autocomplete="off"><button class="primary">Profil erstellen</button></form><p id="nameError" class="muted tiny"></p></section>`;bindProfiles()}
function bindProfiles(){document.querySelectorAll('[data-profile]').forEach(x=>x.onclick=()=>{active=x.dataset.profile;db.active=active;save();show('home')});$('newPlayer').onsubmit=e=>{e.preventDefault();let name=$('newName').value.trim();if(!name)return;let id=uuid();db.profiles[id]={name,completed:0,coins:0,skin:'astronaut',owned:['astronaut'],facts:{},history:[],plays:0,lastPlayed:0};active=id;db.active=id;save();show('home')}}
function home(){let p=player();app.innerHTML=`<section class="launch-screen"><div class="launch-stars">✦ ⋆ · ✧ ⋆ ✦</div><div class="launch-moon" aria-hidden="true"></div><div class="launch-ship">${selectedAvatar(p)}</div><span class="launch-kicker">DEIN ABENTEUER IM ALL</span><h1>STERNEN<br><em>MISSION!</em></h1><p>Flieg von Planet zu Planet.<br>Rechne. Sammle Sterne. Werde ein Mathe-Profi!</p><button class="play-big" id="playNext">PLAY</button><button class="play-big challenge-big" id="challengeHome">CHALLENGE</button><div class="launch-small">Pilot: ${esc(p.name)} · ${Math.min(p.completed,LEVELS.length)} von ${LEVELS.length} Missionen geschafft</div></section>`;$('playNext').onclick=()=>show('map');$('challengeHome').onclick=()=>startChallenge()}
function map(){let p=player(),current=Math.min(p.completed,LEVELS.length-1),due=dueFacts(p).length;let colors=[['#ffce64','#fb7a77'],['#6de7e7','#318fdf'],['#baf584','#3dbf83'],['#ffb4db','#d77bd0'],['#fad980','#e8a555'],['#ce9aff','#745ace'],['#84ddff','#5e82e9'],['#f9a989','#de6e69'],['#99f4c8','#29b39a'],['#ffd17a','#d98940'],['#bafca3','#7ba45a'],['#c2b8ff','#7773d7'],['#ffb9dd','#ad76b5'],['#f8e886','#d89d52']];let nodes=LEVELS.map((l,i)=>{let locked=i>p.completed,done=i<p.completed,c=colors[i],review=!!l.mix;let x=[50,25,68,81,45,19,49,80,64,31,15,49,78,50][i];let y=120+i*148;return `<div class="map-stop" style="top:${y}px;left:${x}%"><button aria-label="Mission ${i+1}: ${esc(l.name)}${locked?', gesperrt':''}" class="planet-node ${done?'done':''} ${i===p.completed?'current':''} ${locked?'locked':''} ${review?'review-node':''}" data-level="${i}" ${locked?'disabled':''} style="--p1:${c[0]};--p2:${c[1]}"><span class="node-art">${review?'★':locked?'—':done?'✓':''}</span><span class="node-number">${i+1}</span></button><div class="node-label">${review?'WIEDERHOLUNG':esc(l.name)}<small>${locked?'Noch gesperrt':done?'Geschafft':i===p.completed?'Nächste Mission':''}</small></div></div>`}).join('');let points=LEVELS.map((_,i)=>{let x=[50,25,68,81,45,19,49,80,64,31,15,49,78,50][i],y=120+i*148;return `${x*8},${y}`}).join(' ');app.innerHTML=`<section class="map-shell"><div class="map-header"><div><span class="launch-kicker">DEINE GALAXIE</span><h1>Planetenkarte</h1><p>Schaffe jede Mission, um den nächsten Planeten freizuschalten!</p></div><div class="map-progress"><b>${Math.min(p.completed,LEVELS.length)} / ${LEVELS.length}</b><span>Missionen</span></div></div><div class="map-tools"><button class="map-tool" id="backMap">⌂ Start</button><button class="map-tool" id="shopMap">Shop (${p.coins})</button><button class="map-tool" id="profilesMap">Profil</button><button class="map-tool" id="saveMap">Sichern</button>${due?`<span class="due-label">${due} Wiederholungen fällig – beim nächsten Sternen-Checkpoint!</span>`:''}</div><div class="map-scroll" id="mapScroll"><div class="map-canvas"><svg class="map-path" viewBox="0 0 800 2200" preserveAspectRatio="none" aria-hidden="true"><polyline points="${points}" fill="none" stroke="#443d84" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${points}" fill="none" stroke="#ffe38b" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 22" stroke-linejoin="round"/></svg><div class="map-stars">✧　⋆　✦　　⋆　 ✧　　 ✦　　⋆</div>${nodes}<div class="map-finish">DAS ZIEL: EINMALEINS-CHAMPION!</div></div></div><p class="map-tip">Sternen-Checkpoints wiederholen bekannte Reihen und besonders schwierige Aufgaben. Neue Missionen bleiben gesperrt, bis du die vorherige bestanden hast.</p></section>`;document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>startLevel(Number(b.dataset.level)));$('backMap').onclick=()=>show('home');$('shopMap').onclick=()=>show('shop');$('profilesMap').onclick=()=>show('profiles');$('saveMap').onclick=exportData;setTimeout(()=>{let scroll=$('mapScroll'),node=document.querySelector('.planet-node.current');if(scroll&&node)scroll.scrollTop=Math.max(0,node.offsetTop-210)},40)}
function shop(){let p=player();app.innerHTML=`<section class="panel"><h1>Skin-Shop</h1><p>Deine Münzen: <b>${p.coins}</b></p><div class="grid">${SKINS.map(s=>{let owned=p.owned.includes(s.id),equipped=p.skin===s.id;return `<div class="tile"><div class="shop-avatar">${avatarArt(s.id)}</div><h3>${s.name}</h3><p class="muted">${s.cost?s.cost+' Münzen':'Kostenlos'}</p><button class="${equipped?'ghost':owned?'secondary':'primary'}" data-skin="${s.id}" ${equipped||(!owned&&p.coins<s.cost)?'disabled':''}>${equipped?'Ausgewählt':owned?'Auswählen':'Kaufen'}</button></div>`}).join('')}</div></section>`;document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{let s=SKINS.find(z=>z.id===b.dataset.skin);if(!s)return;if(!p.owned.includes(s.id)){if(p.coins<s.cost)return;p.coins-=s.cost;p.owned.push(s.id)}p.skin=s.id;save();stat();shop()})}
function startLevel(i){let p=player();if(i>p.completed)return;let l=LEVELS[i],base=factsFor(l.rows),pool;if(l.mix){let due=dueFacts(p).filter(f=>l.rows.includes(f.a)||l.rows.includes(f.b));let seen=new Set();pool=[];for(let f of [...due,...shuffle(base)]){if(!seen.has(f.k)){pool.push(f);seen.add(f.k)}if(pool.length>=15)break}}else pool=shuffle(base);startSession('level',pool,i)}
function startChallenge(){let p=player(),rows=unlockedRows(p),all=shuffle(factsFor(rows));startSession('challenge',all.slice(0,10),null)}
function startReview(){let p=player(),due=dueFacts(p),all=factsFor(unlockedRows(p));if(!all.length){startLevel(0);return}let chosen=due.slice(0,14),keys=new Set(chosen.map(f=>f.k));for(let f of shuffle(all).sort((a,b)=>{let va=p.facts[a.k],vb=p.facts[b.k];return ((va?.streak||0)-(vb?.streak||0))})){if(chosen.length>=14)break;if(!keys.has(f.k)){chosen.push(f);keys.add(f.k)}}startSession('review',shuffle(chosen),null)}
function startSession(type,problems,index){stopQuestionTimer();session={type,index,queue:problems.map(f=>({...f,need:1})),totalBase:problems.length,correct:0,wrong:0,done:0,locked:false,earned:0,firstRight:0,firstWrong:0,seen:new Set(),initial:problems.length,questionNo:0,times:[]};renderQuestion()}
function opts(f){let result=f.a*f.b,s=new Set([result]),candidates=[result-10,result+10,result-f.a,result+f.a,result-f.b,result+f.b,result-1,result+1,result+2,result-2].filter(x=>x>=0&&x<=100&&x!==result);for(let x of shuffle(candidates))if(s.size<4)s.add(x);while(s.size<4)s.add(Math.floor(Math.random()*101));return shuffle([...s])}
function stopQuestionTimer(){if(questionTimer!==null){clearInterval(questionTimer);questionTimer=null}}
function tickClock(){let t=$('timeValue');if(session&&t)t.textContent=(Math.max(0,(performance.now()-session.startedAt)/1000)).toFixed(1)+' s'}
function renderQuestion(message=''){let s=session;if(!s)return;stopQuestionTimer();if(!s.queue.length)return finish();let f=s.queue[0],title=s.type==='challenge'?'Turbo-Challenge':s.type==='review'?'Wiederholungs-Mission':LEVELS[s.index].name,p=player();let progress=Math.min(100,Math.round(s.done/s.initial*100));s.questionNo++;s.startedAt=performance.now();s.mode=s.type==='challenge'?'choice':(s.questionNo%4===0||s.questionNo%7===0)?'choice':'write';let answers=s.mode==='choice'?`<div class="answers">${opts(f).map(n=>`<button class="answer" data-answer="${n}">${n}</button>`).join('')}</div>`:`<form id="answerForm" class="write-answer"><label for="typedAnswer">Dein Ergebnis</label><div class="write-row"><input id="typedAnswer" type="number" min="0" max="100" step="1" inputmode="numeric" pattern="[0-9]*" required autocomplete="off" aria-label="Ergebnis eingeben" placeholder="?"/><button type="submit" class="primary">PRÜFEN</button></div></form>`;app.innerHTML=`<section class="panel question-panel"><div class="row space"><div><span class="pill">${esc(title)}</span><p class="tiny muted">Richtig: ${s.correct} · Noch im Stapel: ${s.queue.length}</p></div><button class="ghost" id="leave">✕ Zur Karte</button></div><div class="row"><div class="progressTrack"><div class="progressFill" style="width:${progress}%"></div></div><span class="tiny">${s.done} / ${s.initial}</span></div><div class="stage"><div class="avatar" id="avatar">${selectedAvatar(p)}</div><span class="tiny">${s.mode==='write'?'Schreibe das Ergebnis auf!':'Wähle die richtige Antwort!'}</span></div><div class="problem">${f.a} × ${f.b} = ?</div>${answers}<div class="feedback" id="feedback" aria-live="polite">${message}</div></section>`;$('leave').onclick=()=>{if(confirm('Mission jetzt verlassen? Bereits gelöste Aufgaben bleiben gespeichert.'))show('map')};if(s.mode==='choice'){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)))}else{$('answerForm').onsubmit=e=>{e.preventDefault();let raw=$('typedAnswer').value.trim();if(raw!==''&&Number.isInteger(Number(raw)))answer(Number(raw))};$('typedAnswer').focus()}if(s.type==='challenge')questionTimer=setInterval(()=>{if(session===s&&!s.locked&&performance.now()-s.startedAt>=10000)answer(null)},100)}
function answer(n){let s=session;if(!s||s.locked)return;stopQuestionTimer();s.locked=true;let elapsed=Math.max(0,Math.round(performance.now()-s.startedAt));let f=s.queue.shift(),correct=n===f.a*f.b,p=player(),v=stateFact(p,f.a,f.b);v.last=Date.now();v.timeTotal=(Number(v.timeTotal)||0)+elapsed;v.timeCount=(Number(v.timeCount)||0)+1;v.lastTime=elapsed;s.times.push(elapsed);if(!Array.isArray(p.history))p.history=[];p.history.push({at:Date.now(),a:f.a,b:f.b,correct:correct,ms:elapsed,mode:s.type,first:!s.seen.has(f.k)});if(p.history.length>12000)p.history=p.history.slice(-12000);if(!s.seen.has(f.k)){s.seen.add(f.k);if(correct)s.firstRight++;else s.firstWrong++}if(correct){v.right++;v.streak++;let days=[1,3,7,14,30][Math.min(4,v.streak-1)];v.due=Date.now()+days*86400000;s.correct++;if(f.need===1)s.done++;else{f.need--;if(f.need>0)insertLater(s.queue,f)}}else{v.wrong++;v.streak=0;v.due=Date.now()+86400000;s.wrong++;if(s.type!=='challenge'){f.need=2;insertLater(s.queue,f)}else{s.done++}}save();document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(Number(b.dataset.answer)===f.a*f.b)b.classList.add('correct');else if(Number(b.dataset.answer)===n)b.classList.add('wrong')});let field=$('typedAnswer');if(field){field.disabled=true;field.classList.add(correct?'right-input':'wrong-input');let btn=$('answerForm').querySelector('button');btn.disabled=true}$('feedback').textContent=correct?'Richtig! Super gemacht!':'Die richtige Antwort ist '+(f.a*f.b)+'. Diese Rechnung kommt nochmals.';$('avatar').style.transform=correct?'translateY(-12px) scale(1.12)':'translateX(-8px)';setTimeout(()=>{if(!session||session!==s)return;s.locked=false;renderQuestion()},correct?850:1750)}
function insertLater(queue,f){let pos=Math.min(queue.length,Math.max(2,Math.floor(Math.random()*4)+2));queue.splice(pos,0,f)}
function finish(){stopQuestionTimer();let s=session,p=player();if(!s)return;let score=s.firstRight,need=Math.ceil(s.initial*.8),passed=score>=need,first=s.type==='level'&&s.index===p.completed;if(first&&passed)p.completed++;let reward=s.type==='challenge'?(passed?20:5):passed?10+Math.min(10,Math.floor(score/3))+(first?15:0):3;p.coins+=reward;p.plays++;p.lastPlayed=Date.now();save();session=null;stat();let avg=s.times.length?(s.times.reduce((a,b)=>a+b,0)/s.times.length/1000).toFixed(1):'–';app.innerHTML=`<section class="panel result-screen"><div class="result-icon">${passed?'★':'·'}</div><span class="launch-kicker">${passed?'MISSION BESTANDEN!':'FAST GESCHAFFT!'}</span><h1>${s.type==='challenge'?(passed?'Challenge geschafft!':'Challenge beendet'):passed?'Planet erobert!':'Noch ein Versuch!'}</h1><p>${s.type==='challenge'?'Deine Challenge trainiert Tempo und Sicherheit. Sie verändert keine Level-Freischaltungen.':passed?'Super! Du hast den Planeten gemeistert und den nächsten freigeschaltet.':'Der nächste Planet bleibt noch gesperrt. Übe diese Mission nochmals – du schaffst das!'}</p><div class="result-score"><div><strong>${score} / ${s.initial}</strong><small>Beim ersten Versuch richtig</small></div><div><strong>${need} / ${s.initial}</strong><small>Zum Bestehen nötig</small></div><div><strong>+${reward} Münzen</strong><small>Weltraummünzen</small></div></div><p class="muted">${s.type==='challenge'?'Schwierige Aufgaben werden in späteren Trainingsmissionen wiederholt.':'Falsche Aufgaben hast du zusätzlich geübt. Sie werden bei späteren Sternen-Checkpoints wiederholt.'}</p><div class="row" style="justify-content:center"><button class="primary" id="again">${s.type==='challenge'?'Nochmal spielen':passed?'Zur Planetenkarte':'Mission wiederholen'}</button><button class="secondary" id="toMap">Planetenkarte</button></div></section>`;$('again').onclick=()=>s.type==='challenge'?startChallenge():passed?show('map'):startLevel(s.index);$('toMap').onclick=()=>show('map')}
$('homeBtn').onclick=()=>show('home');show('home');
})();
</script></body></html>
